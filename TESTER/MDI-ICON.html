<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Design Icons 5.8.55</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@5.8.55/css/materialdesignicons.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 48px;
            margin: 10px;
            color: #007bff;
        }
    </style>
</head>
<body>

    <h2>Contoh Material Design Icons</h2>
    
    <!-- Ikon menggunakan kelas "mdi" -->
    <i class="mdi mdi-home icon"></i>
    <i class="mdi mdi-email icon"></i>
    <i class="mdi mdi-account icon"></i>
    <i class="mdi mdi-heart icon"></i>
    <i class="mdi mdi-star icon"></i>

</body>
</html>

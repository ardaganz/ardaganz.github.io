<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salin URL dari Script</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <h1>Salin URL dari Script</h1>
    <p class="d-flex align-items-center border p-2 rounded-2 border-dashed bg-body text-start mb-0" id="teksShare">https://github.com <a href="https://github.com" class="ms-auto fs-4" id="salinBtn"><i class="bi bi-copy"></i></a></p>

    <script>
        document.getElementById("salinBtn").addEventListener("click", function(event) {
            event.preventDefault();
            var teks = document.getElementById("teksShare").innerText.trim();
            
            navigator.clipboard.writeText(teks).then(function() {
                var icon = document.querySelector("#salinBtn i");
                icon.classList.remove("bi-copy");
                icon.classList.add("bi-check2");
                
                setTimeout(function() {
                    icon.classList.remove("bi-check2");
                    icon.classList.add("bi-copy");
                }, 700);
            }).catch(function(err) {
                console.error("Gagal menyalin teks: ", err);
            });
        });
        
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .shop-card {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        .shop-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .shop-info {
            flex: 1;
            margin-left: 10px;
        }
        .shop-name {
            font-size: 16px;
            font-weight: bold;
        }
        .badge-power {
            background-color: #f4c76f;
            color: black;
            font-size: 12px;
            padding: 3px 7px;
            border-radius: 5px;
        }
        .rating {
            display: inline-flex;
            align-items: center;
            background-color: #e3f7d0;
            color: #000000;
            font-size: 12px;
            padding: 3px 7px;
            border-radius: 5px;
            margin-left: 5px;
        }
        .sold {
            font-size: 14px;
            color: gray;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-follow {
            background-color: #ff3366;
            color: white;
            font-size: 14px;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            width: 80px;
            text-align: center;
        }
        .btn-message {
            position: relative;
            border: 1px solid gray;
            background: white;
            color: black;
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 5px;
            width: 80px;
            text-align: center;
            margin-top: 5px;
        }
        .notification-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background-color: red;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="container mt-3">
    <div class="shop-card">
        <img src="../assets/img/jm_denis.jpg" alt="Shop Logo" class="shop-logo">
        <div class="shop-info">
            <div class="shop-name">DAILYOUTFIT STORE</div>
            <span class="badge-power">Power Shop</span>
            <span class="rating"><i class="bi bi-star-fill"></i> 4.0</span>
            <div class="sold">92.3K terjual</div>
        </div>
        <div class="btn-container">
            <button class="btn btn-follow">Ikuti</button>
            <button class="btn btn-message">
                Pesan
                <span class="notification-dot"></span>
            </button>
        </div>
    </div>
</div>

</body>
</html>

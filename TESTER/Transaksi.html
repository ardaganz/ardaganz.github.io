<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center">Riwayat Transaksi</h2>

    <div class="card shadow-sm p-3 mt-3">
        <div class="d-flex align-items-center">
            <i class="fas fa-wallet fa-2x text-primary me-3"></i>
            <div>
                <h5 class="mb-1">Transfer ke Rekening</h5>
                <p class="mb-0 text-muted">Bank BCA - 1234 5678 9101</p>
            </div>
            <div class="ms-auto">
                <span class="badge bg-success">Rp 500.000</span>
            </div>
        </div>
    </div>

    <div class="card shadow-sm p-3 mt-3">
        <div class="d-flex align-items-center">
            <i class="fas fa-credit-card fa-2x text-danger me-3"></i>
            <div>
                <h5 class="mb-1">Penarikan di ATM</h5>
                <p class="mb-0 text-muted">ATM Mandiri - Jakarta</p>
            </div>
            <div class="ms-auto">
                <span class="badge bg-danger">Rp 1.000.000</span>
            </div>
        </div>
    </div>

    <div class="card shadow-sm p-3 mt-3">
        <div class="d-flex align-items-center">
            <i class="fas fa-exchange-alt fa-2x text-warning me-3"></i>
            <div>
                <h5 class="mb-1">Top Up Dana</h5>
                <p class="mb-0 text-muted">Via Mobile Banking</p>
            </div>
            <div class="ms-auto">
                <span class="badge bg-warning text-dark">Rp 250.000</span>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

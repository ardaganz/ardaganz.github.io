<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Art Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            text-align: center;
            padding: 20px;
        }
        #resultImage {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>AI Art Generator</h1>
    <p>Masukkan teks dan dapatkan gambar AI berdasarkan prompt Anda</p>

    <div class="container">
        <div class="mb-3">
            <input type="text" id="textInput" class="form-control" placeholder="Masukkan prompt...">
        </div>
        <button class="btn btn-primary w-100" onclick="generateImage()">Generate Gambar</button>
        
        <img id="resultImage" alt="Generated AI Art">

        <div id="downloadContainer"></div>
    </div>

    <script>
        let currentImageUrl = ""; // Simpan URL gambar terbaru

        function generateImage() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert("Masukkan teks terlebih dahulu!");
                return;
            }

            // Gunakan timestamp untuk mencegah cache
            const timestamp = new Date().getTime();
            const imageUrl = `https://api.agungny.my.id/api/generateart?prompt=${encodeURIComponent(text)}&t=${timestamp}`;
            console.log("Generated Image URL:", imageUrl); // Debugging

            const resultImage = document.getElementById('resultImage');
            const downloadContainer = document.getElementById('downloadContainer');

            resultImage.onload = function () {
                currentImageUrl = imageUrl; // Perbarui URL gambar setelah benar-benar dimuat
                resultImage.style.display = "block";

                // Buat tombol download & refresh
                downloadContainer.innerHTML = `
                <div class="text-center mt-3">
                    <button class="btn btn-success w-100 mb-2" onclick="downloadImage()">
                        Download Gambar
                    </button>
                    <button class="btn btn-warning w-100" onclick="refreshImage()">
                        Refresh Gambar
                    </button>
                </div>
                `;
            };

            resultImage.onerror = function () {
                alert("Gagal memuat gambar! API mungkin tidak tersedia atau CORS diblokir.");
                console.error("Gambar gagal dimuat dari URL:", imageUrl);
                resultImage.style.display = "none";
                downloadContainer.innerHTML = ""; // Hapus tombol jika gagal
            };

            resultImage.src = imageUrl;
        }

        function refreshImage() {
            if (!currentImageUrl) {
                alert("Gambar belum di-generate!");
                return;
            }

            // Gunakan timestamp agar browser tidak cache gambar lama
            const timestamp = new Date().getTime();
            const newImageUrl = `https://api.agungny.my.id/api/generateart?prompt=${encodeURIComponent(document.getElementById('textInput').value)}&t=${timestamp}`;
            console.log("Refreshing Image URL:", newImageUrl);
            
            const resultImage = document.getElementById('resultImage');
            
            resultImage.onload = function () {
                currentImageUrl = newImageUrl; // Perbarui URL setelah gambar dimuat
            };

            resultImage.src = newImageUrl;
        }

        async function downloadImage() {
            if (!currentImageUrl) {
                alert("Gambar belum di-generate!");
                return;
            }

            console.log("Mencoba mengunduh dari URL:", currentImageUrl);

            try {
                const response = await fetch(currentImageUrl);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = "Ai_Art_Generator.png";
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert("Gagal mengunduh gambar! Periksa API atau koneksi.");
                console.error("Download error:", error);
            }
        }
    </script>

</body>
</html>

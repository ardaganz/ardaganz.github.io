<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Neon Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .badge-neon {
            display: inline-block;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: black;
            border-radius: 50px;
            position: relative;
            box-shadow: 
                -8px 0px 15px rgba(0, 255, 255, 0.8), /* Shadow kiri (cyan) */
                 8px 0px 15px rgba(255, 0, 0, 0.8);  /* Shadow kanan (merah) */
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    
    <span class="badge badge-neon">
        Mall
    </span>

</body>
</html>

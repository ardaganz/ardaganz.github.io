<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Gambar Otomatis & Blokir Klik Lama</title>
    <style>
        img {
            cursor: pointer;
            -webkit-user-drag: none; /* Mencegah drag gambar */
            user-select: none; /* Mencegah seleksi */
        }
    </style>
</head>
<body>
    <img id="gambar" src="https://test2-taupe-psi.vercel.app/assets/img/product/shopee/product-1.png" 
         alt="Gambar API" width="300">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const img = document.getElementById("gambar");

            // Event: Klik gambar untuk mendownload
            img.addEventListener("click", async function () {
                let namaFile = "produk-shopee.png"; // Nama file yang diinginkan
                
                try {
                    let response = await fetch(this.src, { mode: 'cors' });
                    let blob = await response.blob();
                    let blobUrl = URL.createObjectURL(blob);

                    let link = document.createElement("a");
                    link.href = blobUrl;
                    link.download = namaFile;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    URL.revokeObjectURL(blobUrl);
                } catch (error) {
                    alert("Gagal mengunduh gambar. Pastikan server mengizinkan akses.");
                    console.error(error);
                }
            });

            // Blokir klik kanan pada gambar
            img.addEventListener("contextmenu", function (event) {
                event.preventDefault();
            });

            // Blokir klik lama di HP (touchstart + touchend untuk mendeteksi lama tekan)
            let tekanLama;
            img.addEventListener("touchstart", function (event) {
                tekanLama = setTimeout(() => {
                    event.preventDefault();
                }, 500); // Jika tekan lebih dari 500ms, dicegah
            });

            img.addEventListener("touchend", function () {
                clearTimeout(tekanLama);
            });

        });
    </script>
</body>
</html>

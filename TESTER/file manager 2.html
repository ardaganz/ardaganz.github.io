<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    
    <!-- Material Design Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/6.9.96/css/materialdesignicons.min.css">

</head>
<body class="bg-light">

<div class="container mt-4">
    <h3 class="fw-bold">File Manager</h3>
    <p><a href="#" class="text-primary">Home</a> / <a href="#" class="text-primary">Apps</a> / File Manager</p>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-3 border-0 shadow-sm">
                <button class="btn btn-light w-100 mb-3">
                    <i class="mdi mdi-plus"></i> Create New
                </button>

                <ul class="list-group list-unstyled">
                    <li>
                        <a class="text-dark d-flex align-items-center" data-bs-toggle="collapse" href="#fileCollapse" role="button" aria-expanded="true">
                            <i class="mdi mdi-folder text-warning me-2"></i> <strong>Files</strong>
                            <i class="mdi mdi-chevron-down ms-auto"></i>
                        </a>
                        <div class="collapse show" id="fileCollapse">
                            <ul class="list-unstyled ps-4">
                                <li class="py-1"><a href="#" class="text-secondary text-decoration-none">Design</a></li>
                                <li class="py-1 d-flex justify-content-between">
                                    <a href="#" class="text-secondary text-decoration-none">Development</a> <i class="mdi mdi-pin"></i>
                                </li>
                                <li class="py-1"><a href="#" class="text-secondary text-decoration-none">Project A</a></li>
                                <li class="py-1 d-flex justify-content-between">
                                    <a href="#" class="text-secondary text-decoration-none">Admin</a> <i class="mdi mdi-pin"></i>
                                </li>
                            </ul>
                        </div>
                    </li>

                    <li class="mt-2">
                        <a href="#" class="text-dark d-flex align-items-center">
                            <i class="mdi mdi-google-drive text-secondary me-2"></i> <strong>Google Drive</strong>
                        </a>
                    </li>
                    <li class="mt-2">
                        <a href="#" class="text-dark d-flex align-items-center">
                            <i class="mdi mdi-dropbox text-primary me-2"></i> <strong>Dropbox</strong>
                        </a>
                    </li>
                    <li class="mt-2">
                        <a href="#" class="text-dark d-flex align-items-center">
                            <i class="mdi mdi-share-variant me-2"></i> <strong>Shared</strong>
                            <i class="mdi mdi-circle-medium text-danger ms-2"></i>
                        </a>
                    </li>
                    <li class="mt-2">
                        <a href="#" class="text-dark d-flex align-items-center">
                            <i class="mdi mdi-star-outline me-2"></i> <strong>Starred</strong>
                        </a>
                    </li>
                    <li class="mt-2">
                        <a href="#" class="text-dark d-flex align-items-center">
                            <i class="mdi mdi-trash-can text-danger me-2"></i> <strong>Trash</strong>
                        </a>
                    </li>
                    <li class="mt-2 d-flex justify-content-between align-items-center">
                        <a href="#" class="text-dark d-flex align-items-center">
                            <i class="mdi mdi-cog me-2"></i> <strong>Setting</strong>
                        </a>
                        <span class="badge bg-success rounded-pill">01</span>
                    </li>
                </ul>
            </div>

            <div class="mt-3 card p-3 border-0 shadow-sm">
                <div class="d-flex align-items-center">
                    <i class="mdi mdi-folder text-success display-6 me-2"></i>
                    <div>
                        <h5 class="text-success">Upgrade Features</h5>
                        <p class="mb-2">Cum sociis natoque penatibus et</p>
                        <a href="#" class="text-success fw-semibold">Upgrade <i class="mdi mdi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetAlert2 dengan Password</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<button id="klik-WhatsApp">Buka WhatsApp</button>

<script>
$(document).ready(function () {
    $("#klik-WhatsApp").click(function () {
        swal({
            title: "Masukkan Password",
            content: {
                element: "input",
                attributes: {
                    type: "password",
                    placeholder: "Masukkan password Anda",
                },
            },
            buttons: {
                cancel: {
                    text: "Batal",
                    visible: true,
                },
                confirm: {
                    text: "Submit",
                },
            },
        }).then((password) => {
            if (password) {
                if (password === "12345") { // Ganti dengan password yang diinginkan
                    const phoneNumber = "6283143831566"; // Ganti dengan nomor WhatsApp Anda
                    const message = "Hai, apa yang bisa kamu lakukan?";
                    const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
                    window.location.href = whatsappURL;
                } else {
                    swal({
                        title: "Password Salah!",
                        text: "Silakan coba lagi.",
                        icon: "error",
                        buttons: {
                            retry: {
                                text: "Coba Lagi",
                                value: "retry",
                            },
                            close: {
                                text: "Tutup",
                                value: "close",
                            },
                        },
                    }).then((value) => {
                        if (value === "retry") {
                            $("#klik-WhatsApp").click(); // Buka kembali input password
                        }
                    });
                }
            }
        });
    });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetAlert dengan Link</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="container mt-5">

    <h3 class="mb-3">Klik link untuk menampilkan SweetAlert</h3>

    <!-- Link dengan data-swal untuk setiap pesan -->
    <a href="javascript:void(0)" class="btn btn-primary" data-swal="Ini adalah pesan dari Link 1!">Link 1</a>
    <a href="javascript:void(0)" class="btn btn-success" data-swal="Halo, ini dari Link 2!">Link 2</a>
    <a href="javascript:void(0)" class="btn btn-warning" data-swal="Pesan berbeda dari Link 3!">Link 3</a>
    <a href="javascript:void(0)" class="btn btn-danger" data-swal="Peringatan! Ini dari Link 4!">Link 4</a>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const links = document.querySelectorAll("[data-swal]");

            links.forEach(link => {
                link.addEventListener("click", function () {
                    const message = link.getAttribute("data-swal");
                    Swal.fire({
                        title: "Informasi",
                        text: message,
                        icon: "warning",
                        confirmButtonText: "OK"
                    });
                });
            });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilkan URL Halaman</title>
</head>
<body>
    <h1>URL Halaman Saat Ini</h1>
    <p id="output"></p>

    <script>
        // Tampilkan URL halaman saat ini
        document.getElementById("output").textContent = window.location.href;
    </script>
</body>
</html>

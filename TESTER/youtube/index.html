<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download YouTube Video</title>
    <link rel="stylesheet" href="styles.css">
</head>

<style>
	body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f4f4f4;
    margin: 0;
}

.container {
    text-align: center;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 300px;
}

input {
    width: 90%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    border: none;
    background-color: #28a745;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #218838;
}

.hidden {
    display: none;
}

#videoCard {
    margin-top: 20px;
    padding: 15px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

video {
    width: 100%;
    border-radius: 5px;
    margin-bottom: 10px;
}

</style>
<body>
    <div class="container">
        <h2>Download Video YouTube</h2>
        <input type="text" id="youtubeUrl" placeholder="Masukkan URL YouTube">
        <button id="downloadBtn">Download</button>
        
        <div id="videoCard" class="hidden">
            <h3 id="videoTitle"></h3>
            <video id="videoPlayer" controls></video>
            <button id="downloadVideoBtn">Unduh Video</button>
        </div>
    </div>


<script>
	document.getElementById('downloadBtn').addEventListener('click', async () => {
    const urlInput = document.getElementById('youtubeUrl').value;
    
    if (!urlInput) {
        alert("Masukkan URL YouTube terlebih dahulu!");
        return;
    }

    try {
        // Panggil API untuk mendapatkan data video
        const response = await fetch(`https://api.agungny.my.id/api/youtube-videov2?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (!data || !data.result || !data.result.video) {
            alert("Gagal mendapatkan video!");
            return;
        }

        // Ambil video pertama
        const videoUrl = data.result.url;
        const title = data.result.title;

        // Tampilkan video dalam card
        document.getElementById('videoTitle').innerText = title;
        const videoPlayer = document.getElementById('videoPlayer');
        videoPlayer.src = videoUrl;

        document.getElementById('videoCard').classList.remove('hidden');

        // Tambahkan event listener ke tombol download
        document.getElementById('downloadVideoBtn').onclick = function () {
            window.open(videoUrl, '_blank');
        };
    } catch (error) {
        alert("Terjadi kesalahan saat mengambil data video!");
        console.error(error);
    }
});

</script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader TikTok</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">TikTok Video Downloader</h2>
        <form id="downloadForm" class="mt-3">
            <div class="mb-3">
                <input type="text" id="url" class="form-control" placeholder="Masukkan URL TikTok">
            </div>
            <button type="submit" class="btn btn-primary w-100">Download</button>
        </form>
        <div id="result" class="mt-4"></div>
    </div>


<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById('downloadForm');
            const urlInput = document.getElementById('url');
            const resultDiv = document.getElementById('result');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = urlInput.value.trim();

                if (!url) {
                    alert('Silakan masukkan URL.');
                    return;
                }

                if (!/^https?:\/\/[\w\-]+(\.[\w\-]+)+[/#?]?.*$/.test(url)) {
                    alert('URL tidak valid.');
                    return;
                }

                try {
                    resultDiv.innerHTML = '<p class="text-center">Mengambil data...</p>';
                    console.log("Mengirim permintaan ke API...");

                    const response = await fetch(`https://api.sxtream.xyz/downloader/tiktok2?url=${encodeURIComponent(url)}`);
                    
                    console.log("Response status:", response.status);
                    if (!response.ok) {
                        throw new Error(`Gagal mengambil data. Status: ${response.status}`);
                    }

                    const data = await response.json();
                    console.log("Response JSON:", data);

                    if (data.status === 200 && data.result) {
                        const { title = "No Title", region = "Unknown", cover, hdplay } = data.result;

                        if (!hdplay) {
                            resultDiv.innerHTML = `<p class="text-danger">Video tidak tersedia untuk diunduh.</p>`;
                            return;
                        }

                        resultDiv.innerHTML = `
                            <h3>${title}</h3>
                            <p>Region: ${region}</p>
                            ${cover ? `<img src="${cover}" alt="Thumbnail" class="img-fluid">` : ""}
                            <br><br>
                            <video controls class="w-100">
                                <source src="${hdplay}" type="video/mp4">
                                Browser tidak mendukung pemutaran video.
                            </video>
                            <br>
                            <a href="${hdplay}" class="btn btn-success w-100 mt-3" target="_blank" download>Download Video</a>
                        `;
                    } else {
                        resultDiv.innerHTML = `<p class="text-danger">Error dari API: ${data.msg || "Gagal mengambil data."}</p>`;
                    }
                } catch (error) {
                    console.error("Error saat fetch data:", error);
                    resultDiv.innerHTML = `<p class="text-danger">Terjadi kesalahan saat mengambil data. Cek console untuk detail.</p>`;
                }
            });
        });
    </script>

</body>
</html>

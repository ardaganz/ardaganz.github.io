<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Video TikTok</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h1 class="mb-4 text-center">Download Video TikTok</h1>

    <!-- Input URL TikTok -->
    <div class="mb-3">
        <input type="text" id="urlInput" class="form-control" placeholder="Masukkan URL TikTok">
    </div>
    
    <!-- Tombol Fetch Data -->
    <button onclick="fetchData()" class="btn btn-primary w-100">Dapatkan Video</button>

    <!-- Hasil Video -->
    <div id="resultDiv" class="border p-3 rounded shadow-sm mt-4"></div>

<button id="downloadBtn" onclick="downloadVideo('${hdplay}')" class="btn btn-success w-100 mt-3">
    Download Video
</button>


<script>
    function fetchData() {
        const urlInput = document.getElementById("urlInput").value.trim();
        const resultDiv = document.getElementById("resultDiv");

        if (!urlInput) {
            resultDiv.innerHTML = `<p class="text-danger">Masukkan URL TikTok terlebih dahulu!</p>`;
            return;
        }

        const apiURL = `https://api.sxtream.xyz/downloader/tiktok2?url=${encodeURIComponent(urlInput)}`;
        const proxy = "https://api.allorigins.win/raw?url="; // Proxy untuk bypass CORS

        resultDiv.innerHTML = `<p class="text-info">Mengambil data...</p>`;

        fetch(proxy + apiURL)
            .then(response => response.text())
            .then(text => {
                console.log("Response dari API:", text);
                return JSON.parse(text);
            })
            .then(data => {
                if (data.result) {
                    const title = data.result?.title || "Video TikTok";
                    const region = data.result?.region || "Tidak diketahui";
                    const cover = data.result?.cover || "";
                    const hdplay = data.result?.hdplay || "";

                    resultDiv.innerHTML = `
                        <h3>${title}</h3>
                        <p><strong>Region:</strong> ${region}</p>
                        ${cover ? `<img src="${cover}" alt="Thumbnail" class="img-fluid mb-3">` : ""}
                        <br>
                        ${hdplay ? `
                            <video id="videoPlayer" controls class="w-100">
                                <source src="${hdplay}" type="video/mp4">
                                Browser tidak mendukung pemutaran video.
                            </video>
                            <br>
                            <button id="downloadBtn" onclick="downloadVideo('${hdplay}')" class="btn btn-success w-100 mt-3" style="display: none;">
                                Download Video
                            </button>
                        ` : "<p class='text-danger'>Video tidak tersedia.</p>"}
                    `;

                    // Tunggu sampai video selesai ditonton, lalu tampilkan tombol download
                    const videoPlayer = document.getElementById("videoPlayer");
                    const downloadBtn = document.getElementById("downloadBtn");

                    videoPlayer.onended = function() {
                        downloadBtn.style.display = "block";
                    };
                } else {
                    console.error("Error dari API:", data);
                    resultDiv.innerHTML = `<p class="text-danger">Error dari API: ${data.msg || "Gagal mengambil data."}</p>`;
                }
            })
            .catch(error => {
                console.error("Fetch error:", error);
                resultDiv.innerHTML = `<p class="text-danger">Terjadi kesalahan: ${error.message}</p>`;
            });
    }

    function downloadVideo(videoUrl) {
        fetch(videoUrl)
            .then(response => response.blob())
            .then(blob => {
                const a = document.createElement("a");
                const url = window.URL.createObjectURL(blob);
                a.href = url;
                a.download = "tiktok_video.mp4"; // Nama file saat di-download
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            })
            .catch(error => {
                console.error("Download error:", error);
                alert("Gagal mengunduh video!");
            });
    }
</script>


</body>
</html>
